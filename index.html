<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>越谷マップ コメント共有</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; background-color: #1a1a1a; }

    /* カーソルのカスタマイズ */
    #map, .leaflet-grab, .leaflet-interactive {
      cursor: default !important;
    }
    .leaflet-marker-icon, .delete-btn, button, a {
      cursor: pointer !important;
    }

    /* パスコード・ログイン画面 */
    #auth-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; }
    .auth-box { background: #fff; color: #333; padding: 24px; border-radius: 12px; text-align: center; width: 80%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .auth-box input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    .auth-box button { width: 100%; padding: 10px; margin-top: 8px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* ★ポップアップ（吹き出し）のデザイン★ */
    .leaflet-popup-content-wrapper { padding: 4px; border-radius: 8px; }
    .leaflet-popup-content { margin: 12px; width: 280px !important; }
    
    /* 画面からはみ出ないよう高さを画面比率に応じて制限 */
    .popup-container { width: 100%; max-height: 60vh; overflow-y: auto; }
    .comment-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .comment-item { background: #f8f9fa; padding: 10px; border-radius: 6px; border-left: 4px solid #007bff; position: relative; }
    .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .comment-user { font-weight: bold; font-size: 14px; color: #333; }
    .comment-date { font-size: 11px; color: #888; }
    .comment-text { font-size: 14px; color: #333; word-break: break-all; line-height: 1.4; }
    .delete-btn { font-size: 11px; color: #d9534f; cursor: pointer; border: none; background: none; padding: 2px 4px; margin-left: 6px; font-weight: bold; }

    .add-comment-form { display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #eee; padding-top: 10px; }
    .add-comment-form input, .add-comment-form textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    .add-comment-form button { padding: 8px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- ログイン・パスコード認証画面 -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h3 style="margin-top:0;">オープンチャット限定</h3>
      <p style="font-size: 12px; color: #666; margin-bottom: 12px;">名前と合言葉を入力してください</p>
      
      <input type="text" id="username-input" placeholder="名前（表示名）">
      <input type="password" id="passcode-input" placeholder="合言葉">
      
      <button onclick="checkPasscode()">入場する</button>
      <p id="auth-error" style="color: red; font-size: 12px; display: none; margin-top: 8px;"></p>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // 1. 設定情報
    const SECRET_PASSCODE = "koshigaya"; // ★合言葉
    const ADMIN_PASSCODE = "adminadmin";     // ★削除用の管理者パスワード

    let currentUser = "";

    // ポップアップの共通設定（★画面端からはみ出ないように50px余白を開けて自動移動★）
    const popupOptions = {
      maxWidth: 300,
      autoPan: true,
      autoPanPadding: [50, 50]
    };

    // ★Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyB5crDFLr90xs8MgDPbt4jqZS-tvAHiFlU",
      authDomain: "koshigaya-map.firebaseapp.com",
      databaseURL: "https://koshigaya-map-default-rtdb.firebaseio.com",
      projectId: "koshigaya-map",
      storageBucket: "koshigaya-map.firebasestorage.app",
      messagingSenderId: "270056992218",
      appId: "1:270056992218:web:34097826f0ed6f7d78e4e3",
      measurementId: "G-S46JHYRHP1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const pinsRef = db.ref('map_pins');

    // ページ読み込み時に保存済みの認証情報・名前をチェック
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('koshigaya_map_username');
      const savedAuth = localStorage.getItem('koshigaya_map_auth');

      if (savedUser) {
        document.getElementById('username-input').value = savedUser;
      }

      if (savedAuth === 'true' && savedUser) {
        currentUser = savedUser;
        document.getElementById('auth-overlay').style.display = 'none';
      }
    });

    // 2. パスコード・名前認証機能
    function checkPasscode() {
      const usernameInput = document.getElementById('username-input').value.trim();
      const passInput = document.getElementById('passcode-input').value;
      const errorEl = document.getElementById('auth-error');

      if (!usernameInput) {
        errorEl.textContent = "名前を入力してください。";
        errorEl.style.display = 'block';
        return;
      }

      if (passInput === SECRET_PASSCODE) {
        currentUser = usernameInput;
        
        localStorage.setItem('koshigaya_map_username', currentUser);
        localStorage.setItem('koshigaya_map_auth', 'true');

        document.getElementById('auth-overlay').style.display = 'none';
      } else {
        errorEl.textContent = "合言葉が違います。";
        errorEl.style.display = 'block';
      }
    }

    // 3. 地図の初期化 (縦3200px × 横2400px)
    const imgWidth = 2400;
    const imgHeight = 3200;
    const bounds = [[0, 0], [imgHeight, imgWidth]];

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -2,
      maxZoom: 2,
      maxBounds: bounds,
      maxBoundsViscosity: 0.8
    });

    L.imageOverlay('koshigaya_map.png', bounds).addTo(map);
    map.fitBounds(bounds);

    // 4. ピンとスレッドの管理
    const activeMarkers = {};

    pinsRef.on('child_removed', (snapshot) => {
      const pinId = snapshot.key;
      if (activeMarkers[pinId]) {
        map.removeLayer(activeMarkers[pinId]);
        delete activeMarkers[pinId];
      }
    });

    pinsRef.on('value', (snapshot) => {
      const pinsData = snapshot.val() || {};

      Object.keys(activeMarkers).forEach(pinId => {
        if (!pinsData[pinId]) {
          map.removeLayer(activeMarkers[pinId]);
          delete activeMarkers[pinId];
        }
      });

      Object.keys(pinsData).forEach(pinId => {
        const pin = pinsData[pinId];

        if (!pin.comments || Object.keys(pin.comments).length === 0) {
          pinsRef.child(pinId).remove();
          if (activeMarkers[pinId]) {
            map.removeLayer(activeMarkers[pinId]);
            delete activeMarkers[pinId];
          }
          return;
        }

        const comments = Object.keys(pin.comments).map(k => ({ id: k, ...pin.comments[k] }));

        let commentsHtml = comments.map(c => {
          const dateStr = new Date(c.timestamp).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          return `
            <div class="comment-item">
              <div class="comment-header">
                <span class="comment-user">${escapeHtml(c.name)}</span>
                <span class="comment-date">${dateStr}</span>
                <button class="delete-btn" onclick="deleteComment('${pinId}', '${c.id}')">削除</button>
              </div>
              <div class="comment-text">${escapeHtml(c.comment).replace(/\n/g, '<br>')}</div>
            </div>
          `;
        }).join('');

        const popupContent = `
          <div class="popup-container">
            <div class="comment-list">${commentsHtml}</div>
            <div class="add-comment-form">
              <input type="text" id="name-${pinId}" value="${escapeHtml(currentUser)}" placeholder="名前">
              <textarea id="comment-${pinId}" rows="2" placeholder="追記コメント..."></textarea>
              <button onclick="addCommentToPin('${pinId}')">コメントを追加</button>
            </div>
          </div>
        `;

        if (activeMarkers[pinId]) {
          activeMarkers[pinId].getPopup().setContent(popupContent);
        } else {
          const marker = L.marker([pin.y, pin.x]).addTo(map);
          marker.bindPopup(popupContent, popupOptions);
          activeMarkers[pinId] = marker;
        }
      });
    });

    // 5. 新しい場所にピンを打つ（新規投稿）
    map.on('click', (e) => {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      if (x < 0 || x > imgWidth || y < 0 || y > imgHeight) return;

      const formHtml = `
        <div class="add-comment-form" style="width:100%;">
          <strong style="font-size:13px; color:#333;">ここに新しいピンを立てる</strong>
          <input type="text" id="new-name" value="${escapeHtml(currentUser)}" placeholder="お名前">
          <textarea id="new-comment" rows="2" placeholder="コメント..."></textarea>
          <button onclick="createNewPin(${x}, ${y})">ピンを打つ</button>
        </div>
      `;

      L.popup(popupOptions).setLatLng(e.latlng).setContent(formHtml).openOn(map);
    });

    // 新規ピン作成
    function createNewPin(x, y) {
      const name = document.getElementById('new-name').value.trim();
      const comment = document.getElementById('new-comment').value.trim();
      if (!name || !comment) return alert("名前とコメントを入力してください。");

      if (name !== currentUser) {
        currentUser = name;
        localStorage.setItem('koshigaya_map_username', currentUser);
      }

      const newPinRef = pinsRef.push();
      newPinRef.set({
        x: x, y: y,
        comments: {
          first: { name: name, comment: comment, timestamp: firebase.database.ServerValue.TIMESTAMP }
        }
      });
      map.closePopup();
    }

    // 既存のピンに追記コメント
    function addCommentToPin(pinId) {
      const name = document.getElementById(`name-${pinId}`).value.trim();
      const comment = document.getElementById(`comment-${pinId}`).value.trim();
      if (!name || !comment) return alert("名前とコメントを入力してください。");

      if (name !== currentUser) {
        currentUser = name;
        localStorage.setItem('koshigaya_map_username', currentUser);
      }

      pinsRef.child(`${pinId}/comments`).push({
        name: name,
        comment: comment,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }

    // コメントの削除機能
    function deleteComment(pinId, commentId) {
      const pass = prompt("管理者パスワードを入力してください:");
      if (pass !== ADMIN_PASSCODE) {
        if (pass !== null) alert("パスワードが違います。");
        return;
      }

      const pinRef = pinsRef.child(pinId);
      
      pinRef.child('comments').once('value', (snapshot) => {
        const comments = snapshot.val() || {};
        const commentKeys = Object.keys(comments);

        if (commentKeys.length <= 1 || !comments[commentId]) {
          pinRef.remove().then(() => {
            map.closePopup();
          });
        } else {
          pinRef.child(`comments/${commentId}`).remove();
        }
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
