<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>越谷マップ コメント共有</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; background-color: #1a1a1a; }

    /* パスコード画面 */
    #auth-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; }
    .auth-box { background: #fff; color: #333; padding: 24px; border-radius: 12px; text-align: center; width: 80%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .auth-box input { width: 100%; padding: 10px; margin: 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    .auth-box button { width: 100%; padding: 10px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* ポップアップ（吹き出し）のデザイン */
    .popup-container { max-width: 260px; max-height: 300px; overflow-y: auto; }
    .comment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .comment-item { background: #f8f9fa; padding: 8px; border-radius: 6px; border-left: 3px solid #007bff; position: relative; }
    .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .comment-user { font-weight: bold; font-size: 12px; color: #333; }
    .comment-date { font-size: 10px; color: #888; }
    .comment-text { font-size: 13px; color: #444; word-break: break-all; }
    .delete-btn { font-size: 10px; color: #d9534f; cursor: pointer; border: none; background: none; padding: 0; margin-left: 6px; }

    .add-comment-form { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #eee; padding-top: 8px; }
    .add-comment-form input, .add-comment-form textarea { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .add-comment-form button { padding: 6px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="auth-overlay">
    <div class="auth-box">
      <h3>オープンチャット限定</h3>
      <p style="font-size: 12px; color: #666;">ノートに記載されている合言葉を入力してください</p>
      <input type="password" id="passcode-input" placeholder="合言葉を入力">
      <button onclick="checkPasscode()">入場する</button>
      <p id="auth-error" style="color: red; font-size: 12px; display: none; margin-top: 8px;">合言葉が違います</p>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    // 1. 設定情報
    const SECRET_PASSCODE = "koshigaya2026"; // ★合言葉
    const ADMIN_PASSCODE = "admin";     // ★削除用の管理者パスワード

    // ★Firebase設定（ご自身のものに置き換えてください）
    const firebaseConfig = {
    apiKey: "AIzaSyB5crDFLr90xs8MgDPbt4jqZS-tvAHiFlU",
    authDomain: "koshigaya-map.firebaseapp.com",
    databaseURL: "https://koshigaya-map-default-rtdb.firebaseio.com",
    projectId: "koshigaya-map",
    storageBucket: "koshigaya-map.firebasestorage.app",
    messagingSenderId: "270056992218",
    appId: "1:270056992218:web:34097826f0ed6f7d78e4e3",
    measurementId: "G-S46JHYRHP1"
  };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const pinsRef = db.ref('map_pins');

    // 2. パスコード認証
    function checkPasscode() {
      const input = document.getElementById('passcode-input').value;
      if (input === SECRET_PASSCODE) {
        document.getElementById('auth-overlay').style.display = 'none';
      } else {
        document.getElementById('auth-error').style.display = 'block';
      }
    }

    // 3. 地図の初期化 (縦3200px × 横2400px)
    const imgWidth = 2400;
    const imgHeight = 3200;
    const bounds = [[0, 0], [imgHeight, imgWidth]];

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -2,
      maxZoom: 2,
      maxBounds: bounds,
      maxBoundsViscosity: 0.8
    });

    L.imageOverlay('koshigaya_map.png', bounds).addTo(map);
    map.fitBounds(bounds);

   // 4. ピンとスレッド（複数コメント）の読み込み・保持
    const activeMarkers = {}; // pinId -> Leaflet Marker

    // 【追加】Firebase側でピンが削除されたら、画面上のピンも消すリアルタイム処理
    pinsRef.on('child_removed', (snapshot) => {
      const pinId = snapshot.key;
      if (activeMarkers[pinId]) {
        map.removeLayer(activeMarkers[pinId]); // 地図上からピンを消去
        delete activeMarkers[pinId];            // メモリから削除
      }
    });

    // データの変更・追加を監視
    pinsRef.on('value', (snapshot) => {
      const pinsData = snapshot.val() || {};

      // Firebaseに存在しないピンが画面に残っていれば消去する（一括削除対策）
      Object.keys(activeMarkers).forEach(pinId => {
        if (!pinsData[pinId]) {
          map.removeLayer(activeMarkers[pinId]);
          delete activeMarkers[pinId];
        }
      });

      // ピンの描画・更新処理
      Object.keys(pinsData).forEach(pinId => {
        const pin = pinsData[pinId];
        const comments = pin.comments ? Object.keys(pin.comments).map(k => ({ id: k, ...pin.comments[k] })) : [];

        let commentsHtml = comments.map(c => {
          const dateStr = new Date(c.timestamp).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          return `
            <div class="comment-item">
              <div class="comment-header">
                <span class="comment-user">${escapeHtml(c.name)}</span>
                <span class="comment-date">${dateStr}</span>
                <button class="delete-btn" onclick="deleteComment('${pinId}', '${c.id}')">削除</button>
              </div>
              <div class="comment-text">${escapeHtml(c.comment).replace(/\n/g, '<br>')}</div>
            </div>
          `;
        }).join('');

        const popupContent = `
          <div class="popup-container">
            <div class="comment-list">${commentsHtml}</div>
            <div class="add-comment-form">
              <input type="text" id="name-${pinId}" placeholder="名前">
              <textarea id="comment-${pinId}" rows="2" placeholder="追記コメント..."></textarea>
              <button onclick="addCommentToPin('${pinId}')">コメントを追加</button>
            </div>
          </div>
        `;

        if (activeMarkers[pinId]) {
          activeMarkers[pinId].getPopup().setContent(popupContent);
        } else {
          const marker = L.marker([pin.y, pin.x]).addTo(map);
          marker.bindPopup(popupContent);
          activeMarkers[pinId] = marker;
        }
      });
    });
    // 5. 新しい場所にピンを打つ（新規投稿）
    map.on('click', (e) => {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      if (x < 0 || x > imgWidth || y < 0 || y > imgHeight) return;

      const formHtml = `
        <div class="add-comment-form" style="min-width:180px;">
          <strong style="font-size:12px;">ここに新しいピンを立てる</strong>
          <input type="text" id="new-name" placeholder="お名前">
          <textarea id="new-comment" rows="2" placeholder="コメント..."></textarea>
          <button onclick="createNewPin(${x}, ${y})">ピンを打つ</button>
        </div>
      `;

      L.popup().setLatLng(e.latlng).setContent(formHtml).openOn(map);
    });

    // 新規ピン作成
    function createNewPin(x, y) {
      const name = document.getElementById('new-name').value.trim();
      const comment = document.getElementById('new-comment').value.trim();
      if (!name || !comment) return alert("名前とコメントを入力してください。");

      const newPinRef = pinsRef.push();
      newPinRef.set({
        x: x, y: y,
        comments: {
          first: { name: name, comment: comment, timestamp: firebase.database.ServerValue.TIMESTAMP }
        }
      });
      map.closePopup();
    }

    // 既存のピンに追記コメント
    function addCommentToPin(pinId) {
      const name = document.getElementById(`name-${pinId}`).value.trim();
      const comment = document.getElementById(`comment-${pinId}`).value.trim();
      if (!name || !comment) return alert("名前とコメントを入力してください。");

      pinsRef.child(`${pinId}/comments`).push({
        name: name,
        comment: comment,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }

    // コメントの削除機能（管理者パスワード認証）
    function deleteComment(pinId, commentId) {
      const pass = prompt("管理者パスワードを入力してください:");
      if (pass === ADMIN_PASSCODE) {
        pinsRef.child(`${pinId}/comments/${commentId}`).remove();
      } else if (pass !== null) {
        alert("パスワードが違います。");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
